<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>
    {% if page.title %}
      {{ page.title }} | {{ site.title }}
    {% else %}
      {{ site.title }}
    {% endif %}
  </title>

  <meta name="description" content="{{ page.description | default: site.description }}">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body>

<header class="site-header">
  <div class="container">
    <a class="site-title" href="{{ '/' | relative_url }}">PianopianoAI</a>

    <nav>
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/articoli/' | relative_url }}">Articoli</a>
      <a href="{{ '/about/' | relative_url }}">Il progetto</a>
      <a href="https://pianopianoai.substack.com" target="_blank">Newsletter</a>
    </nav>
  </div>
</header>

<main class="container">
  {{ content }}
</main>

<footer class="site-footer">
  <div class="container">
    <p>PianopianoAI — Intelligenza artificiale, spiegata piano piano.</p>
  </div>
</footer>

</body>
</html>
