name: Aggiorna feed PianopianoAI

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scarica feed PianopianoAI
        uses: Promptly-Technologies-LLC/rss-fetch-action@v2
        with:
          feed_url: https://pianopianoai.substack.com/feed
          file_path: ./articles.json
          parser_options: '{"useISODateFormat": true}'

      - name: Salva aggiornamenti
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles.json
          git diff --cached --quiet || git commit -m "Aggiorna articoli PianopianoAI"
          git push
