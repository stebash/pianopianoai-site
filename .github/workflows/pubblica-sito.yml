
name: Pubblica PianopianoAI

on:
  push:
    branches:
      - main

  schedule:
    - cron: '45 8 * * 3'
      timezone: 'Europe/Rome'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Genera il sito Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Carica il sito generato
        uses: actions/upload-pages-artifact@v4

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Pubblica il sito
        id: deployment
        uses: actions/deploy-pages@v4
